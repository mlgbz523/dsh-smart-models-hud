<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Models · 用量看板</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #131722;
    --panel-2: #1a2030;
    --border: rgba(255,255,255,0.09);
    --text: #e6ebf5;
    --muted: #8b96ab;
    --accent: #38bdf8;
    --accent-2: #7dd3fc;
    --warn: #fbbf24;
    --danger: #f87171;
    --ok: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 20px 22px 60px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1 1 auto; }

  .ranges { display: flex; gap: 6px; }
  .ranges button {
    padding: 5px 12px; border-radius: 999px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--text);
    transition: all .14s ease;
  }
  .ranges button:hover { background: rgba(255,255,255,.06); }
  .ranges button.active { background: rgba(56,189,248,.16); border-color: rgba(56,189,248,.6); color: var(--accent-2); font-weight: 600; }

  .views { display: flex; gap: 6px; margin: 14px 0 0; flex-wrap: wrap; }
  .views button {
    padding: 5px 14px; border-radius: 6px; font-size: 12.5px; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--text);
    transition: all .14s ease;
  }
  .views button:hover { background: rgba(255,255,255,.06); }
  .views button.active { background: rgba(56,189,248,.16); border-color: rgba(56,189,248,.6); color: var(--accent-2); font-weight: 600; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 16px 0; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px;
  }
  .card .k { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .card .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card .v.warn { color: var(--warn); }
  .card .v.ok { color: var(--ok); }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .panel h2 { font-size: 13px; margin: 0 0 10px; font-weight: 600; }

  #chart { display: block; width: 100%; height: 150px; }
  #chart rect.bar { fill: var(--accent); opacity: .82; cursor: pointer; transition: opacity .12s; }
  #chart rect.bar:hover { opacity: 1; }
  #chart rect.bar.sel { fill: var(--accent-2); opacity: 1; }
  #chart text { fill: var(--muted); font-size: 9px; }
  #chart line.axis { stroke: rgba(255,255,255,.14); stroke-width: 1; }

  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .filters label { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; }
  .filters select, .filters input[type=search] {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-size: 12px; padding: 5px 8px; outline: none; min-width: 130px;
  }
  .filters input[type=search] { min-width: 180px; }
  .filters select:focus, .filters input:focus { border-color: rgba(56,189,248,.55); }
  .filters button {
    padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--text);
  }
  .filters button:hover { background: rgba(255,255,255,.06); }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { padding: 6px 9px; border-bottom: 1px solid rgba(255,255,255,.05); text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; position: sticky; top: 0; background: var(--panel); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.mono { font-variant-numeric: tabular-nums; }
  tr.suspect td { opacity: .55; }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .tag.bad { color: var(--warn); border-color: rgba(251,191,36,.4); }
  .tag.clean { color: var(--ok); border-color: rgba(74,222,128,.35); }
  .table-wrap { max-height: 460px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; }

  .pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 10px; color: var(--muted); font-size: 12px; }
  .pager button { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; }
  .pager button:disabled { opacity: .35; cursor: default; }

  .empty { padding: 28px; text-align: center; color: var(--muted); font-size: 12.5px; }
  .err { padding: 14px; border-radius: 8px; background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.35); color: var(--danger); font-size: 12.5px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; padding: 4px 0; }
  details summary:hover { color: var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Smart Models · 用量看板</h1>
    <span class="sub" id="since"></span>
    <span class="spacer"></span>
    <div class="ranges" id="ranges">
      <button data-range="today">今天</button>
      <button data-range="7d" class="active">近 7 天</button>
      <button data-range="30d">近 30 天</button>
      <button data-range="all">全部</button>
    </div>
  </header>

  <div class="views" id="views">
    <button data-view="overview" class="active">概览</button>
    <button data-view="consume">消耗分析</button>
    <button data-view="compare">渠道对比</button>
    <button data-view="detail">明细</button>
  </div>

  <div class="cards" id="cards"></div>

  <div id="view-consume" style="display:none">
    <div class="panel">
      <h2>每日消耗趋势（按渠道堆叠）</h2>
      <svg id="chartStack" viewBox="0 0 900 180" preserveAspectRatio="none"></svg>
      <div class="empty" id="chartStackEmpty" style="display:none">暂无可信积分数据</div>
    </div>
    <div class="panel">
      <h2>渠道积分消耗排行 <span class="sub">（估算值 · 免费层级单列）</span></h2>
      <svg id="chartRank" viewBox="0 0 900 60" preserveAspectRatio="none"></svg>
    </div>
  </div>

  <div id="view-compare" style="display:none">
    <div class="panel">
      <h2>渠道余额增减 <span class="sub">（正向=消耗 · 负向=签到/充值增加）</span></h2>
      <svg id="chartDelta" viewBox="0 0 900 160" preserveAspectRatio="none"></svg>
      <div class="empty" id="chartDeltaEmpty" style="display:none">暂无余额变动数据（需新版本记录）</div>
    </div>
    <div class="panel">
      <h2>渠道性价比 <span class="sub">（积分 ÷ Token，越低越好）</span></h2>
      <table><thead><tr><th>渠道</th><th class="num">Token</th><th class="num">积分(估)</th><th class="num">性价比</th><th class="num">请求</th><th class="num">消耗率</th></tr></thead><tbody id="byValue"></tbody></table>
    </div>
  </div>

  <div class="panel">
    <h2>每日积分消耗 <span class="sub" id="chartHint" style="font-weight:400"></span></h2>
    <svg id="chart" viewBox="0 0 900 150" preserveAspectRatio="none"></svg>
    <div class="empty" id="chartEmpty" style="display:none">当前范围内没有可信的积分消耗</div>
  </div>

  <div class="panel">
    <h2>筛选</h2>
    <div class="filters">
      <label>渠道
        <select id="fProvider"><option value="">全部</option></select>
      </label>
      <label>模型
        <select id="fModel"><option value="">全部</option></select>
      </label>
      <label><input type="checkbox" id="fTrusted"> 仅可信记录</label>
      <input type="search" id="fSearch" placeholder="搜索渠道 / 模型…">
      <button id="fReset">重置</button>
      <span class="spacer"></span>
      <span class="sub" id="filterStat"></span>
    </div>
  </div>

  <div class="panel">
    <h2>明细日志 <span class="sub" id="detailCount" style="font-weight:400"></span></h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>时间</th>
            <th>渠道</th>
            <th>模型</th>
            <th class="num">积分</th>
            <th class="num">Token</th>
            <th>状态</th>
          </tr>
        </thead>
        <tbody id="detailBody"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </div>

  <div class="panel">
    <details>
      <summary>按渠道汇总</summary>
      <table><thead><tr><th>渠道</th><th class="num">请求</th><th class="num">积分</th><th class="num">Token</th></tr></thead><tbody id="byProvider"></tbody></table>
    </details>
    <details style="margin-top:8px">
      <summary>按模型汇总</summary>
      <table><thead><tr><th>模型</th><th class="num">请求</th><th class="num">积分</th><th class="num">Token</th></tr></thead><tbody id="byModel"></tbody></table>
    </details>
  </div>
</div>

<script>
(function () {
  'use strict';
  var PAGE_SIZE = 100;
  var state = {
    events: [],
    since: 0,
    range: '7d',
    provider: '',
    model: '',
    trustedOnly: false,
    search: '',
    selectedDay: null,
    page: 0,
    view: 'overview',
    balances: {}
  };

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function num(n) {
    if (!isFinite(n)) return '—';
    var r = Math.round(n * 100) / 100;
    var s = Number.isInteger(r) ? String(r) : r.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
    var parts = s.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return parts.join('.');
  }
  function compact(n) {
    if (!isFinite(n)) return '—';
    if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(2) + 'M';
    if (Math.abs(n) >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return String(Math.round(n));
  }
  function dayKey(ts) {
    var d = new Date(ts);
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + dd;
  }
  function timeStr(ts) {
    var d = new Date(ts);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ':' + String(d.getSeconds()).padStart(2, '0');
  }
  function dateStr(ts) {
    var d = new Date(ts);
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  function rangeStart(range) {
    if (range === 'all') return 0;
    if (range === 'today') { var d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
    var days = range === '30d' ? 30 : 7;
    return Date.now() - days * 86400000;
  }

  // 事件过滤（时间范围 → 渠道/模型/可信/搜索 → 点选某天）
  function filtered() {
    var start = rangeStart(state.range);
    var q = state.search.trim().toLowerCase();
    return state.events.filter(function (e) {
      if (!e || !isFinite(e.at)) return false;
      if (e.at < start) return false;
      if (state.provider && e.provider !== state.provider) return false;
      if (state.model && e.model !== state.model) return false;
      if (state.trustedOnly && e.creditsKnown !== true) return false;
      if (state.selectedDay && dayKey(e.at) !== state.selectedDay) return false;
      if (q) {
        var hay = String(e.provider || '').toLowerCase() + ' ' + String(e.model || '').toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function computeTotals(rows) {
    var t = { requests: 0, credits: 0, tokens: 0, trusted: 0, suspect: 0 };
    for (var i = 0; i < rows.length; i++) {
      var e = rows[i];
      t.requests += isFinite(e.requests) ? e.requests : 1;
      t.tokens += (isFinite(e.inputTokens) ? e.inputTokens : 0) + (isFinite(e.outputTokens) ? e.outputTokens : 0);
      if (e.creditsKnown === true) { t.trusted++; t.credits += isFinite(e.credits) ? e.credits : 0; }
      else t.suspect++;
    }
    return t;
  }

  function renderCards(rows) {
    var t = computeTotals(rows);
    var rate = rows.length ? Math.round(t.trusted / rows.length * 100) : 0;
    $('cards').innerHTML = [
      card('请求', num(t.requests)),
      card('Token', compact(t.tokens)),
      card('积分', t.credits > 0 ? num(t.credits) : '—'),
      card('可信率', rate + '%', rate >= 90 ? 'ok' : 'warn'),
      card('可疑轮次', String(t.suspect), t.suspect > 0 ? 'warn' : '')
    ].join('');
  }
  function card(k, v, cls) {
    return '<div class="card"><div class="k">' + esc(k) + '</div><div class="v ' + (cls || '') + '">' + esc(v) + '</div></div>';
  }

  function renderChart(rows) {
    var svg = $('chart');
    var emptyEl = $('chartEmpty');
    var byDay = {};
    for (var i = 0; i < rows.length; i++) {
      var e = rows[i];
      if (e.creditsKnown !== true || !isFinite(e.credits) || e.credits <= 0) continue;
      var k = dayKey(e.at);
      byDay[k] = (byDay[k] || 0) + e.credits;
    }
    var days = Object.keys(byDay).sort();
    if (days.length === 0) {
      svg.innerHTML = '';
      svg.style.display = 'none';
      emptyEl.style.display = '';
      $('chartHint').textContent = '';
      return;
    }
    svg.style.display = '';
    emptyEl.style.display = 'none';

    var W = 900, H = 150, PAD_L = 10, PAD_B = 18, PAD_T = 8;
    var max = Math.max.apply(null, days.map(function (d) { return byDay[d]; }));
    var plotH = H - PAD_T - PAD_B;
    var step = (W - PAD_L * 2) / days.length;
    var bw = Math.max(4, Math.min(28, step * 0.62));
    var parts = [];

    days.forEach(function (d, idx) {
      var bh = Math.max(2, plotH * (byDay[d] / max));
      var x = PAD_L + idx * step + (step - bw) / 2;
      var y = PAD_T + plotH - bh;
      var sel = state.selectedDay === d ? ' sel' : '';
      parts.push('<rect class="bar' + sel + '" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="2" data-day="' + d + '"><title>' + esc(d) + ' · ' + num(byDay[d]) + ' 积分</title></rect>');
      if (days.length <= 16 || idx % Math.ceil(days.length / 16) === 0) {
        parts.push('<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 5) + '" text-anchor="middle">' + esc(d.slice(5)) + '</text>');
      }
    });
    parts.push('<line class="axis" x1="0" y1="' + (PAD_T + plotH) + '" x2="' + W + '" y2="' + (PAD_T + plotH) + '"/>');
    parts.push('<text x="' + (W - 4) + '" y="' + (PAD_T + 8) + '" text-anchor="end">峰值 ' + num(max) + '</text>');
    svg.innerHTML = parts.join('');
    $('chartHint').textContent = state.selectedDay ? '（已筛选 ' + state.selectedDay + '，再点一次取消）' : '（点柱体可筛选当天）';

    // 点柱体 → 过滤当天
    Array.prototype.forEach.call(svg.querySelectorAll('rect.bar'), function (r) {
      r.addEventListener('click', function () {
        var d = r.getAttribute('data-day');
        state.selectedDay = (state.selectedDay === d) ? null : d;
        state.page = 0;
        render();
      });
    });
  }

  function statusOf(e) {
    if (e.suspect === 'provider-switch') return '<span class="tag bad">渠道切换</span>';
    if (e.suspect === 'account-change') return '<span class="tag bad">账号变化</span>';
    if (e.cleaned === true) return '<span class="tag">已清理</span>';
    if (e.creditsKnown === false) return '<span class="tag">不可信</span>';
    return '<span class="tag clean">可信</span>';
  }

  function renderDetail(rows) {
    var total = rows.length;
    var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (state.page >= pages) state.page = pages - 1;
    if (state.page < 0) state.page = 0;
    var start = state.page * PAGE_SIZE;
    var slice = rows.slice().sort(function (a, b) { return (b.at || 0) - (a.at || 0); }).slice(start, start + PAGE_SIZE);

    $('detailCount').textContent = '（' + total + ' 条）';
    $('detailBody').innerHTML = slice.length === 0
      ? '<tr><td colspan="6" class="empty">当前筛选下没有记录</td></tr>'
      : slice.map(function (e) {
          var tok = (isFinite(e.inputTokens) ? e.inputTokens : 0) + (isFinite(e.outputTokens) ? e.outputTokens : 0);
          var suspect = e.creditsKnown !== true || e.suspect || e.cleaned;
          return '<tr class="' + (suspect ? 'suspect' : '') + '">' +
            '<td class="mono" title="' + esc(new Date(e.at).toLocaleString()) + '">' + esc(dateStr(e.at)) + ' ' + esc(timeStr(e.at)) + '</td>' +
            '<td>' + esc(e.provider || '—') + '</td>' +
            '<td title="' + esc(e.model || '') + '">' + esc(e.model || '—') + '</td>' +
            '<td class="num">' + (e.creditsKnown === true && isFinite(e.credits) ? num(e.credits) : '—') + '</td>' +
            '<td class="num">' + (tok > 0 ? compact(tok) : '—') + '</td>' +
            '<td>' + statusOf(e) + '</td>' +
            '</tr>';
        }).join('');

    $('pager').innerHTML = total <= PAGE_SIZE ? '' :
      '<button id="prev"' + (state.page === 0 ? ' disabled' : '') + '>上一页</button>' +
      '<span>第 ' + (state.page + 1) + ' / ' + pages + ' 页</span>' +
      '<button id="next"' + (state.page >= pages - 1 ? ' disabled' : '') + '>下一页</button>';
    var prev = $('prev'), next = $('next');
    if (prev) prev.addEventListener('click', function () { state.page--; render(); });
    if (next) next.addEventListener('click', function () { state.page++; render(); });
  }

  function aggregate(rows, keyOf) {
    var map = {};
    rows.forEach(function (e) {
      var k = keyOf(e) || '（未知）';
      if (!map[k]) map[k] = { requests: 0, credits: 0, tokens: 0 };
      map[k].requests += isFinite(e.requests) ? e.requests : 1;
      map[k].tokens += (isFinite(e.inputTokens) ? e.inputTokens : 0) + (isFinite(e.outputTokens) ? e.outputTokens : 0);
      if (e.creditsKnown === true) map[k].credits += isFinite(e.credits) ? e.credits : 0;
    });
    return Object.keys(map).sort(function (a, b) { return map[b].credits - map[a].credits; })
      .map(function (k) {
        var v = map[k];
        return '<tr><td>' + esc(k) + '</td><td class="num">' + num(v.requests) + '</td>' +
          '<td class="num">' + (v.credits > 0 ? num(v.credits) : '—') + '</td>' +
          '<td class="num">' + (v.tokens > 0 ? compact(v.tokens) : '—') + '</td></tr>';
      }).join('');
  }

  function fillSelects() {
    var providers = {}, models = {};
    state.events.forEach(function (e) {
      if (e.provider) providers[e.provider] = 1;
      if (e.model) models[e.model] = 1;
    });
    var ps = Object.keys(providers).sort();
    var ms = Object.keys(models).sort();
    $('fProvider').innerHTML = '<option value="">全部</option>' +
      ps.map(function (p) { return '<option value="' + esc(p) + '"' + (state.provider === p ? ' selected' : '') + '>' + esc(p) + '</option>'; }).join('');
    $('fModel').innerHTML = '<option value="">全部</option>' +
      ms.map(function (m) { return '<option value="' + esc(m) + '"' + (state.model === m ? ' selected' : '') + '>' + esc(m) + '</option>'; }).join('');
  }

  function render() {
    var rows = filtered();
    renderCards(rows);
    renderChart(rows);
    renderStack(rows);
    renderRank(rows);
    renderDelta(rows);
    renderValue(rows, state.balances || {});
    renderDetail(rows);
    $('byProvider').innerHTML = aggregate(rows, function (e) { return e.provider; });
    $('byModel').innerHTML = aggregate(rows, function (e) { return e.model; });
    $('filterStat').textContent = rows.length + ' / ' + state.events.length + ' 条';
  }

  // ══ 子视图切换 ══
  function setView(name) {
    state.view = name;
    ['overview','consume','compare','detail'].forEach(v => {
      var el = document.getElementById('view-' + v);
      if (el) el.style.display = (v === name || (v === 'overview')) ? '' : 'none';
    });
    // 概览永远可见；其余互斥
    if (name !== 'overview') {
      document.getElementById('view-consume').style.display = (name === 'consume') ? '' : 'none';
      document.getElementById('view-compare').style.display = (name === 'compare') ? '' : 'none';
      document.querySelector('.panel:has(#detailBody)')?.setAttribute('style', name === 'detail' ? '' : 'display:none');
    } else {
      document.getElementById('view-consume').style.display = 'none';
      document.getElementById('view-compare').style.display = 'none';
      document.querySelector('.panel:has(#detailBody)')?.setAttribute('style', '');
    }
    Array.prototype.forEach.call(document.querySelectorAll('#views button'), function (b) {
      b.classList.toggle('active', b.getAttribute('data-view') === name);
    });
  }

  // ══ 堆叠柱状图：每日消耗按渠道 ══
  function renderStack(rows) {
    var svg = document.getElementById('chartStack');
    var empty = document.getElementById('chartStackEmpty');
    var byDay = {};
    var provs = {};
    rows.forEach(function (e) {
      if (e.creditsKnown !== true || !isFinite(e.credits) || e.credits <= 0) return;
      var d = dayKey(e.at), p = e.provider || '未知';
      if (!byDay[d]) byDay[d] = {};
      byDay[d][p] = (byDay[d][p] || 0) + e.credits;
      provs[p] = 1;
    });
    var days = Object.keys(byDay).sort();
    var plist = Object.keys(provs);
    if (!days.length) { svg.style.display='none'; empty.style.display=''; return; }
    svg.style.display=''; empty.style.display='none';

    var COLORS = ['#38bdf8','#a78bfa','#fbbf24','#4ade80','#f87171','#22d3ee','#fb923c','#c084fc'];
    var colorOf = function (p) { var i = plist.indexOf(p); return COLORS[i % COLORS.length]; };
    var W = 900, H = 180, PAD_L = 10, PAD_B = 20, PAD_T = 10;
    var plotH = H - PAD_T - PAD_B;
    var totals = days.map(function (d) { return plist.reduce(function (s, p) { return s + (byDay[d][p] || 0); }, 0); });
    var max = Math.max.apply(null, totals) || 1;
    var step = (W - PAD_L * 2) / days.length;
    var bw = Math.max(4, Math.min(30, step * 0.62));
    var out = [];
    days.forEach(function (d, idx) {
      var x = PAD_L + idx * step + (step - bw) / 2;
      var yBase = PAD_T + plotH;
      plist.forEach(function (p) {
        var v = byDay[d][p] || 0;
        if (v <= 0) return;
        var hh = plotH * (v / max);
        yBase -= hh;
        out.push('<rect x="' + x.toFixed(1) + '" y="' + yBase.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hh.toFixed(1) + '" fill="' + colorOf(p) + '" opacity="0.85"><title>' + esc(d) + ' · ' + esc(p) + ' · ' + num(v) + '</title></rect>');
      });
      if (days.length <= 16 || idx % Math.ceil(days.length / 16) === 0) {
        out.push('<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" fill="#8b96ab" font-size="9">' + esc(d.slice(5)) + '</text>');
      }
    });
    // legend
    plist.forEach(function (p, i) {
      var lx = PAD_L + i * 110;
      out.push('<rect x="' + lx + '" y="2" width="8" height="8" fill="' + colorOf(p) + '"/>');
      out.push('<text x="' + (lx + 12) + '" y="9" fill="#8b96ab" font-size="9">' + esc(p.slice(0, 10)) + '</text>');
    });
    svg.innerHTML = out.join('');
  }

  // ══ 渠道排行（横向条形）══
  function renderRank(rows) {
    var svg = document.getElementById('chartRank');
    var agg = {};
    rows.forEach(function (e) {
      var p = e.provider || '未知';
      if (!agg[p]) agg[p] = { credits: 0, free: 0, n: 0 };
      agg[p].n++;
      if (e.freeTier === true) agg[p].free++;
      if (e.creditsKnown === true && isFinite(e.credits)) agg[p].credits += e.credits;
    });
    var list = Object.keys(agg).map(function (k) { return { p: k, v: agg[k] }; })
      .sort(function (a, b) { return b.v.credits - a.v.credits; });
    var H = Math.max(60, list.length * 26 + 10);
    svg.setAttribute('viewBox', '0 0 900 ' + H);
    var max = Math.max.apply(null, list.map(function (x) { return x.v.credits; })) || 1;
    var out = [];
    list.forEach(function (x, i) {
      var y = i * 26 + 6;
      var w = 620 * (x.v.credits / max);
      var isFree = x.v.credits === 0 && x.v.free > 0;
      out.push('<rect x="150" y="' + y + '" width="' + Math.max(2, w).toFixed(1) + '" height="16" rx="3" fill="' + (isFree ? '#334155' : '#38bdf8') + '" opacity="0.85"><title>' + esc(x.p) + ' · ' + num(x.v.credits) + '</title></rect>');
      out.push('<text x="4" y="' + (y + 12) + '" fill="#e6ebf5" font-size="10">' + esc(x.p.slice(0, 18)) + '</text>');
      out.push('<text x="' + (150 + Math.max(2, w) + 8) + '" y="' + (y + 12) + '" fill="#8b96ab" font-size="10">' + (isFree ? '免费层级' : num(x.v.credits)) + '</text>');
    });
    svg.innerHTML = out.join('');
  }

  // ══ 余额增减（双向条形）══
  function renderDelta(rows) {
    var svg = document.getElementById('chartDelta');
    var empty = document.getElementById('chartDeltaEmpty');
    var agg = {};
    var hasDelta = false;
    rows.forEach(function (e) {
      if (!isFinite(e.delta)) return;
      hasDelta = true;
      var p = e.provider || '未知';
      if (!agg[p]) agg[p] = { spend: 0, gain: 0 };
      if (e.delta > 0) agg[p].spend += e.delta;   // 余额下降 = 消耗
      else agg[p].gain += -e.delta;               // 余额上升 = 签到/充值
    });
    if (!hasDelta) { svg.style.display='none'; empty.style.display=''; return; }
    svg.style.display=''; empty.style.display='none';
    var list = Object.keys(agg).map(function (k) { return { p: k, v: agg[k] }; });
    var max = 1;
    list.forEach(function (x) { max = Math.max(max, x.v.spend, x.v.gain); });
    var H = Math.max(80, list.length * 30 + 20);
    svg.setAttribute('viewBox', '0 0 900 ' + H);
    var mid = 450;
    var out = ['<line x1="' + mid + '" y1="0" x2="' + mid + '" y2="' + H + '" stroke="rgba(255,255,255,.18)" stroke-width="1"/>'];
    list.forEach(function (x, i) {
      var y = i * 30 + 10;
      var spendW = 400 * (x.v.spend / max);
      var gainW = 400 * (x.v.gain / max);
      if (spendW > 0) out.push('<rect x="' + (mid - spendW).toFixed(1) + '" y="' + y + '" width="' + spendW.toFixed(1) + '" height="16" rx="2" fill="#f87171" opacity="0.8"><title>消耗 ' + num(x.v.spend) + '</title></rect>');
      if (gainW > 0) out.push('<rect x="' + mid + '" y="' + y + '" width="' + gainW.toFixed(1) + '" height="16" rx="2" fill="#4ade80" opacity="0.8"><title>增加 ' + num(x.v.gain) + '</title></rect>');
      out.push('<text x="4" y="' + (y + 12) + '" fill="#e6ebf5" font-size="10">' + esc(x.p.slice(0, 16)) + '</text>');
    });
    svg.innerHTML = out.join('');
  }

  // ══ 性价比 + 消耗率 ══
  function renderValue(rows, balanceMap) {
    var agg = {};
    rows.forEach(function (e) {
      var p = e.provider || '未知';
      if (!agg[p]) agg[p] = { credits: 0, tokens: 0, requests: 0, free: 0 };
      agg[p].requests += isFinite(e.requests) ? e.requests : 1;
      if (e.freeTier === true) agg[p].free++;
      if (e.creditsKnown === true && isFinite(e.credits)) agg[p].credits += e.credits;
      agg[p].tokens += (isFinite(e.inputTokens) ? e.inputTokens : 0) + (isFinite(e.outputTokens) ? e.outputTokens : 0);
    });
    var list = Object.keys(agg).map(function (k) { return { p: k, v: agg[k] }; })
      .sort(function (a, b) { return (a.v.credits / (a.v.tokens || 1)) - (b.v.credits / (b.v.tokens || 1)); });
    document.getElementById('byValue').innerHTML = list.map(function (x) {
      var cpt = x.v.tokens > 0 ? (x.v.credits / x.v.tokens * 1000) : null;  // 每千 token 积分
      var bal = balanceMap[x.p];
      var rate = (bal && bal.total > 0) ? (x.v.credits / bal.total * 100) : null;
      return '<tr><td>' + esc(x.p) + (x.v.free > 0 && x.v.credits === 0 ? ' <span class="tag">免费</span>' : '') + '</td>' +
        '<td class="num">' + (x.v.tokens > 0 ? compact(x.v.tokens) : '—') + '</td>' +
        '<td class="num">' + (x.v.credits > 0 ? num(x.v.credits) : '—') + '</td>' +
        '<td class="num">' + (cpt === null ? '—' : cpt.toFixed(3)) + '</td>' +
        '<td class="num">' + num(x.v.requests) + '</td>' +
        '<td class="num">' + (rate === null ? '—' : rate.toFixed(1) + '%') + '</td></tr>';
    }).join('');
  }

  // ── 事件绑定 ──
  document.getElementById('views').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-view]');
    if (!b) return;
    setView(b.getAttribute('data-view'));
  });

  $('ranges').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-range]');
    if (!b) return;
    state.range = b.getAttribute('data-range');
    state.selectedDay = null;
    state.page = 0;
    Array.prototype.forEach.call($('ranges').querySelectorAll('button'), function (x) {
      x.classList.toggle('active', x === b);
    });
    render();
  });
  $('fProvider').addEventListener('change', function (e) { state.provider = e.target.value; state.page = 0; render(); });
  $('fModel').addEventListener('change', function (e) { state.model = e.target.value; state.page = 0; render(); });
  $('fTrusted').addEventListener('change', function (e) { state.trustedOnly = e.target.checked; state.page = 0; render(); });
  $('fSearch').addEventListener('input', function (e) { state.search = e.target.value; state.page = 0; render(); });
  $('fReset').addEventListener('click', function () {
    state.provider = ''; state.model = ''; state.trustedOnly = false;
    state.search = ''; state.selectedDay = null; state.page = 0;
    $('fProvider').value = ''; $('fModel').value = ''; $('fTrusted').checked = false; $('fSearch').value = '';
    render();
  });

  // ── 拉数据 ──
  function load() {
    fetch('/api/smart-models/usage', { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        if (!data || data.ok !== true) throw new Error((data && data.error) || '读取失败');
        state.events = Array.isArray(data.events) ? data.events : [];
        state.since = isFinite(data.since) ? data.since : 0;
        $('since').textContent = state.since
          ? '统计起始 ' + new Date(state.since).toLocaleDateString()
          : '';
        fillSelects();
        render();
      })
      .catch(function (err) {
        document.querySelector('.wrap').insertAdjacentHTML('afterbegin',
          '<div class="err">台账读取失败：' + esc(err && err.message ? err.message : err) +
          '<br><span style="opacity:.7">请确认 DeepSeek Harness 正在运行。</span></div>');
      });
  }

  load();
})();
</script>
</body>
